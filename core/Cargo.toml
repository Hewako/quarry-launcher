[package]
name = "quarry-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ядро лаунчера Quarry: метаданные, загрузка, Java, запуск, профили, аккаунты"

[features]
# Запуск без входа — только для отладки разработчиком на собственной копии игры,
# пока Mojang не одобрил client ID. В релизной сборке включить нельзя (см. lib.rs).
dev-launch = []

[[bin]]
name = "quarry"
path = "src/bin/quarry.rs"

[dependencies]
anyhow = "1.0.104"                  # только в CLI (src/bin)
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }  # локальное время в строках лога; MIT/Apache-2.0
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
image = "0.25"
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "linux-native"] }
open = "5.3.2"
rand = "0.8.5"
regex = "1.13.1"                    # правила os.version в JSON версий; MIT/Apache-2.0
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"                # единая модель ошибок библиотеки; MIT/Apache-2.0
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
urlencoding = "2.1.3"
zip = "9.0.5"
