# Установщики по тегу (например v0.1.0): macOS (Apple Silicon и Intel), Windows, Linux.
# Без подписи и нотаризации (решение владельца) — релиз создаётся черновиком, владелец
# проверяет и публикует его сам. Ключи CurseForge и Microsoft — из секретов репозитория.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-latest, args: "--target aarch64-apple-darwin", target: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-latest, args: "--target x86_64-apple-darwin", target: x86_64-apple-darwin }
          - { name: Windows, os: windows-latest, args: "", target: "" }
          - { name: Linux, os: ubuntu-22.04, args: "", target: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки для Tauri и keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Зависимости интерфейса
        working-directory: ui
        run: npm ci

      - name: Сборка и черновик релиза
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARRY_CURSEFORGE_KEY: ${{ secrets.QUARRY_CURSEFORGE_KEY }}
          QUARRY_MS_CLIENT_ID: ${{ secrets.QUARRY_MS_CLIENT_ID }}
        with:
          projectPath: ui
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Quarry ${{ github.ref_name }}
          releaseBody: |
            Что нового — в [CHANGELOG.md](https://github.com/Hewako/quarry-launcher/blob/main/CHANGELOG.md).

            Установщики не подписаны: при первом запуске система предупредит об этом.
            macOS: правый клик по приложению → «Открыть». Windows: «Подробнее» → «Выполнить в любом случае».
          releaseDraft: true
          prerelease: false
