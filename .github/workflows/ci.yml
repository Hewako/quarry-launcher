# Сборка и тесты на трёх ОС. Релизы не публикуются, секретов нет.
name: CI

on:
  push:
    branches: [main, "stage-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки для Tauri и keyring (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Интерфейс — npm ci и сборка
        working-directory: ui
        run: |
          npm ci
          npm run build
          npm run i18n:check
          npm run ipc:check

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (без сети; сетевые тесты помечены #[ignore])
        run: cargo test --workspace

      - name: dev-launch не собирается в релизе
        shell: bash
        run: |
          if cargo check -p quarry-core --release --features dev-launch 2>/dev/null; then
            echo "dev-launch собрался в release — так быть не должно"; exit 1
          fi
          echo "ok: dev-launch недоступен в release"
