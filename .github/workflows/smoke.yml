# «Чистая машина» (план v1.3, Gate 1→2): на пустой папке данных Axel сам скачивает и
# проверяет последнюю релизную версию Minecraft и подходящую Java и собирает команду запуска.
# Игру не запускает: без купленного аккаунта запуск запрещён правилами проекта.
# Скачивает ~1 ГБ на каждой ОС, поэтому — вручную и перед релизом, а не на каждый push.
name: Smoke

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  clean-install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Библиотеки для keyring (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.os }}

      - name: Сборка консольного Axel
        run: cargo build -p quarry-core --bin quarry

      - name: Последняя релизная версия Minecraft
        # Сначала в файл: awk выходит на первой строке, и quarry упал бы на закрытом канале.
        run: |
          target/debug/quarry versions > "$RUNNER_TEMP/versions.txt"
          v=$(awk '$2 == "release" { print $1; exit }' "$RUNNER_TEMP/versions.txt")
          test -n "$v"
          echo "MC=$v" >> "$GITHUB_ENV"
          echo "Версия: $v"

      - name: Профиль на пустой папке данных
        run: target/debug/quarry --root "$RUNNER_TEMP/q" instance create smoke --version "$MC"

      - name: Установка с проверкой всех хэшей
        run: target/debug/quarry --root "$RUNNER_TEMP/q" install smoke --verify

      - name: Команда запуска собирается
        # Сначала в файл: команда длиной 10+ КБ, а head закрыл бы канал раньше времени.
        run: |
          target/debug/quarry --root "$RUNNER_TEMP/q" preview smoke > "$RUNNER_TEMP/preview.txt"
          head -c 600 "$RUNNER_TEMP/preview.txt"
