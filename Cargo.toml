[package]
name = "quarry-core"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
image = "0.25"
keyring = { version = "3.6.2", features = ["apple-native", "windows-native", "linux-native"] }
open = "5.3.2"
rand = "0.8.5"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
urlencoding = "2.1.3"
walkdir = "2.5.0"
zip = "9.0.5"
