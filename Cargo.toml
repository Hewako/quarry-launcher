[workspace]
resolver = "3"
members = ["core", "ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Hewako/quarry-launcher"

# Настройки релизной сборки (раньше были в ui/src-tauri, профили действуют только в корне workspace).
# См. https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
